<style>
  article.post header .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: .25rem .75rem;
  }

  article.post header .meta .article-tag::before,
  article.post header .meta .article-category::before {
    margin-inline-end: .75rem;
  }

  pre.mermaid { overflow-x: auto; padding: 1rem 0; background: transparent; text-align: center; }
  pre.mermaid svg { max-width: 100%; height: auto; }
</style>
<script type="module">
  const diagrams = document.querySelectorAll('.mermaid');

  if (diagrams.length > 0) {
    const { default: mermaid } = await import(
      'https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs'
    );

    const darkMode = {{ eq .Site.Params.colorscheme "dark" }};

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'strict',
      theme: darkMode ? 'dark' : 'neutral',
      fontFamily: 'Verdana, sans-serif',
      flowchart: { useMaxWidth: true }
    });

    await mermaid.run({ nodes: diagrams });
  }
</script>
